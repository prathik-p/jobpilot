# Company career pages read through their public job APIs (no scraping, no login).
#
# How to tell which system a company uses: open one of its job links.
#   jobs.lever.co/<slug>/...                     -> lever
#   boards.greenhouse.io/<slug>/...              -> greenhouse   (also job-boards.greenhouse.io/<slug>)
#   jobs.ashbyhq.com/<slug>/...                  -> ashby
#   jobs.smartrecruiters.com/<CompanyId>/...     -> smartrecruiters
#   <tenant>.wd5.myworkdayjobs.com/<Site>/job/.. -> workday: paste the URL up to <Site>
# Entries are either the slug/URL, or `Display Name: slug-or-url`.
#
# Run
#   python -m jobpilot check-companies
# to confirm each entry resolves.

